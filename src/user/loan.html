<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Loans — ADC Gadgets</title>
    <meta name="description" content="View and manage your ADC Gadgets device loans.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../../src/shared/css/global.css">
    <link rel="stylesheet" href="css/user.css">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/loan.css">
</head>

<body>

    <!-- ━━━ HEADER ━━━ -->
    <header class="hdr">
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="nav-ham-btn" id="nav-ham-btn" aria-label="Open navigation menu" aria-expanded="false">
                <i data-lucide="menu" style="width:18px;height:18px;"></i>
            </button>
            <a href="user-home.html" class="logo">
                <img src="../../images/logo.jpg" alt="ADC Gadgets" class="logo-img">
                <span class="logo-name">ADC Gadgets</span>
            </a>
        </div>
        <nav class="hdr-nav">
            <a href="user-home.html">Shop</a>
            <a href="devices.html">Devices</a>
            <a href="support.html">Support</a>
        </nav>
    </header>

    <!-- ━━━ SUB-NAV ━━━ -->
    <nav class="sub-nav">
        <a href="user-home.html">Featured</a>
        <a href="devices.html">Devices</a>
        <a href="support.html">Setup &amp; Support</a>
    </nav>

    <!-- ━━━ HERO WRAPPER (Solid Black) ━━━ -->
    <div class="hero-wrap account-hero" style="text-align: center;">
        <h1 class="support-title account-title" style="font-size: 32px; margin-bottom: 4px;"><span class="glow-pink">My Loans</span></h1>
        <h2 class="support-subtitle account-greeting" style="font-size: 16px;">Hello, <span id="hero-first-name" style="color: var(--pink);">there</span>.</h2>
    </div>

    <!-- ━━━ MAIN (Solid White) ━━━ -->
    <main class="main" style="background:#fff; padding: 40px 24px; min-height: 60vh;">
        <div class="loan-page-layout">
            <div class="loan-container" id="loan-container">
                <div style="text-align:center; padding: 60px; color:var(--text-muted);">
                    <i data-lucide="loader-2" class="spin" style="width:32px;height:32px;"></i>
                    <p style="margin-top:12px;">Loading your loans...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Payment process removed for now -->

    <!-- ━━━ FOOTER ━━━ -->
    <footer class="footer">
        <p>© 2026 ADC Gadgets. All rights reserved.</p>
        <p>Affordable • Trusted • Quality</p>
    </footer>

    <!-- ━━━ SIDEBAR DRAWER ━━━ -->
    <div id="sb-overlay"></div>
        <aside id="sidebar">
        <!-- Logo Header -->
        <div class="sb-head" style="padding-top: 40px; border-bottom: none;">
            <button class="sb-close" id="sb-close" aria-label="Close menu">
                <i data-lucide="x" style="width:14px;height:14px;"></i>
            </button>
            <a href="user-home.html" style="display:flex; align-items:center; gap:12px; font-weight:700; font-size: 20px; font-family: 'Outfit', sans-serif;">
                <img src="../../images/logo.jpg" alt="Logo" style="width:36px; height:36px; border-radius:8px;">
                ADC Gadgets
            </a>
        </div>

        <!-- Nav Links -->
        <nav class="sb-nav" style="padding: 8px 16px; display: flex; flex-direction: column; gap: 4px;">

            <a href="user-home.html" class="sb-link" style="border-radius: 8px;">
                <span class="sb-icon"><i data-lucide="shopping-bag" style="width:18px;height:18px;"></i></span>
                Shop
            </a>

            <a href="account.html" class="sb-link" style="border-radius: 8px;">
                <span class="sb-icon"><i data-lucide="user-cog" style="width:18px;height:18px;"></i></span>
                Profile
            </a>

            <a href="loan.html" class="sb-link" style="border-radius: 8px;">
                <span class="sb-icon"><i data-lucide="credit-card" style="width:18px;height:18px;"></i></span>
                Loan
            </a>

            <a href="support.html" class="sb-link" style="border-radius: 8px;">
                <span class="sb-icon"><i data-lucide="help-circle" style="width:18px;height:18px;"></i></span>
                Support
            </a>

        </nav>

        <!-- Profile Footer -->
        <div class="sb-foot" style="padding: 24px; border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 12px; margin-top: auto;">
            <div class="sb-user" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.03);">
                <div class="sb-avatar-wrap">
                    <img src="../../images/logo.jpg" alt="User" class="sb-avatar" id="sb-avatar-img" style="width:40px; height:40px;">
                    <span class="sb-avatar-dot"></span>
                </div>
                <div class="sb-user-info">
                    <div class="sb-name" id="sb-user-name" style="font-size: 15px; font-weight: 600;">ADC Member</div>
                    <div class="sb-email" id="sb-user-email" style="font-size: 13px; color: rgba(255,255,255,0.5);">test123@test.com</div>
                </div>
            </div>
            <button class="sb-signout" id="sb-logout" onclick="window.location.href='/src/user/login.html'" style="border-radius: 8px; justify-content: flex-start;">
                <span class="sb-icon"><i data-lucide="log-out" style="width:18px;height:18px;"></i></span>
                Logout
            </button>
        </div>
    </aside>

    <!-- ━━━ TOAST ━━━ -->
    <div id="toast">
        <i data-lucide="check-circle" style="width:18px;height:18px;"></i>
        <span id="toast-msg">Success!</span>
    </div>

    <!-- Core Scripts -->
    <script src="../../src/shared/js/supabase.js"></script>
    <script src="js/ui.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/loan.js"></script>

</body>
</html>
