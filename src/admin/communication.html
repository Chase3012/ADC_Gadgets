<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communication — ADC Admin</title>
  <meta name="description" content="ADC Gadgets Admin Dashboard — Analytics and Sales overview.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../src/shared/css/global.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="app bento-shell">

  <!-- FLOATING TOP PILL HEADER -->
  <header class="top-pill-bar">
    <a href="dashboard.html" class="top-pill-brand">
      <img src="/images/logo.jpg" alt="ADC Gadgets Logo">
      <span>ADC Gadgets</span>
    </a>

    <nav class="top-pill-nav" aria-label="Admin Navigation">
      <a href="dashboard.html" class="top-pill-link">Overview</a>
      <a href="loan-ledger.html" class="top-pill-link">Active Loans</a>
      <a href="communication.html" class="top-pill-link active" id="nav-communications">Communication <span class="nav-badge" id="global-chat-badge" style="display:none;"></span></a>
      <a href="inventory.html" class="top-pill-link">Inventory</a>
      <a href="manage-users.html" class="top-pill-link">Customers</a>
      <a href="reports.html" class="top-pill-link">Reports</a>
    </nav>

    <div class="top-pill-utils">
      <div class="admin-avatar-pill" title="Admin">AD</div>
    </div>
  </header>

  <div class="shell-body">
    <!-- SLIM LEFT ICON RAIL -->
    <aside class="icon-rail" aria-label="Quick Admin Shortcuts">
      <div class="rail-group">
        <a href="dashboard.html" class="rail-btn" aria-label="Overview" title="Overview">
          <i data-lucide="layout-grid" style="width:18px;height:18px;"></i>
        </a>
        <a href="loan-ledger.html" class="rail-btn" aria-label="Active Loans" title="Active Loans">
          <i data-lucide="credit-card" style="width:18px;height:18px;"></i>
        </a>
        <a href="communication.html" class="rail-btn active" aria-label="Communication" title="Communication">
          <i data-lucide="message-circle" style="width:18px;height:18px;"></i>
          <span class="rail-unread-dot" id="rail-chat-dot"></span>
        </a>
        <a href="inventory.html" class="rail-btn" aria-label="Inventory" title="Inventory">
          <i data-lucide="smartphone" style="width:18px;height:18px;"></i>
        </a>
        <a href="manage-users.html" class="rail-btn" aria-label="Customers" title="Customers">
          <i data-lucide="users" style="width:18px;height:18px;"></i>
        </a>
        <a href="reports.html" class="rail-btn" aria-label="Reports" title="Reports">
          <i data-lucide="bar-chart-2" style="width:18px;height:18px;"></i>
        </a>
      </div>

      <div class="rail-group">
        <button id="logout-btn" class="rail-btn rail-logout" type="button" aria-label="Logout" title="Logout">
          <i data-lucide="log-out" style="width:18px;height:18px;"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" style="display:flex; flex-direction:column; height:calc(100vh - 122px); min-height:540px; overflow:hidden;">
      <div class="bento-page-head">
        <h1 class="bento-greeting">Customer <span>Communication</span></h1>
      </div>

      <div class="content" style="flex:1; display:flex; flex-direction:column; min-height:0; padding:0; overflow:hidden;">
        
        <div class="chat-shell" style="display:flex; flex-direction:row; gap:16px; flex:1; min-height:0; width:100%;">
          <!-- Left sidebar: User list -->
          <div class="chat-sidebar" style="width:320px; border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; background:var(--surface);">
            <div style="padding: 20px; border-bottom: 1px solid var(--border);">
              <div style="position:relative;">
                <i data-lucide="search" style="position:absolute; left:12px; top:10px; width:16px; height:16px; color:var(--text-muted);"></i>
                <input type="text" id="chat-search-input" aria-label="Search conversations" placeholder="Search conversations..." style="color: var(--text-main); background: var(--surface); width:100%; padding:10px 10px 10px 36px; border-radius:20px; border:1px solid var(--border); font-size:13px;">
              </div>
            </div>
            <div id="admin-chat-list" style="flex:1; overflow-y:auto;" aria-busy="true">
              <!-- Initial chat skeleton items -->
              <div class="sk-chat-item"><span class="sk sk-pill" style="width:42px;height:42px;flex-shrink:0;"></span><div style="flex:1;display:flex;flex-direction:column;gap:7px;"><div style="display:flex;justify-content:space-between;gap:12px;"><span class="sk" style="width:52%;height:13px;"></span><span class="sk" style="width:38px;height:11px;"></span></div><span class="sk" style="width:76%;height:11px;"></span></div></div>
              <div class="sk-chat-item"><span class="sk sk-pill" style="width:42px;height:42px;flex-shrink:0;"></span><div style="flex:1;display:flex;flex-direction:column;gap:7px;"><div style="display:flex;justify-content:space-between;gap:12px;"><span class="sk" style="width:46%;height:13px;"></span><span class="sk" style="width:38px;height:11px;"></span></div><span class="sk" style="width:68%;height:11px;"></span></div></div>
              <div class="sk-chat-item"><span class="sk sk-pill" style="width:42px;height:42px;flex-shrink:0;"></span><div style="flex:1;display:flex;flex-direction:column;gap:7px;"><div style="display:flex;justify-content:space-between;gap:12px;"><span class="sk" style="width:58%;height:13px;"></span><span class="sk" style="width:38px;height:11px;"></span></div><span class="sk" style="width:72%;height:11px;"></span></div></div>
              <div class="sk-chat-item"><span class="sk sk-pill" style="width:42px;height:42px;flex-shrink:0;"></span><div style="flex:1;display:flex;flex-direction:column;gap:7px;"><div style="display:flex;justify-content:space-between;gap:12px;"><span class="sk" style="width:44%;height:13px;"></span><span class="sk" style="width:38px;height:11px;"></span></div><span class="sk" style="width:64%;height:11px;"></span></div></div>
              <div class="sk-chat-item"><span class="sk sk-pill" style="width:42px;height:42px;flex-shrink:0;"></span><div style="flex:1;display:flex;flex-direction:column;gap:7px;"><div style="display:flex;justify-content:space-between;gap:12px;"><span class="sk" style="width:50%;height:13px;"></span><span class="sk" style="width:38px;height:11px;"></span></div><span class="sk" style="width:70%;height:11px;"></span></div></div>
            </div>
          </div>

          <!-- Right area: Chat thread -->
          <div class="chat-main" style="flex:1; display:flex; flex-direction:column; min-height:0; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden;">
            
            <div id="admin-chat-empty" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
              <div style="width:64px; height:64px; background:var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
                <i data-lucide="message-square" style="width:32px; height:32px; color:#94a3b8;"></i>
              </div>
              <div style="color:var(--text-main); font-weight:700; font-size:16px; margin-bottom:8px;">Your Messages</div>
              <div style="color:var(--text-muted); font-size:14px;">Select a conversation to start messaging</div>
            </div>

            <!-- Chat Header -->
            <div class="chat-header" id="chat-header-container" style="display:none; padding:20px 24px; border-bottom:1px solid var(--border); align-items:center; justify-content:space-between; background:var(--surface);">
              <div style="display:flex; align-items:center; gap:12px;" id="admin-chat-user-info">
                <div id="chat-header-initial" style="width:40px; height:40px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#475569;">U</div>
                <div>
                  <div id="chat-header-name" style="font-size:16px; font-weight:700; color:var(--text-main);">User Name</div>
                  <div style="font-size:12px; color:var(--text-muted);">Support Thread</div>
                </div>
              </div>
              <div>
                <button id="chat-resolve-btn" style="padding:8px 16px; font-size:12px; font-weight:600; color:var(--text-muted); background:transparent; border:1px solid var(--border); border-radius:20px; cursor:pointer;">Resolve</button>
              </div>
            </div>

            <!-- Messages -->
            <div id="admin-chat-messages" style="display:none; flex:1; overflow-y:auto; padding:24px; background:var(--bg); display:flex; flex-direction:column; gap:16px;">
              <!-- Messages go here -->
            </div>

            <!-- Input Box -->
            <div id="chat-input-container" style="display:none; padding:20px 24px; border-top:1px solid var(--border); background:var(--surface);">
              <div style="display:flex; gap:12px; align-items:flex-end;">
                <textarea id="admin-chat-input" aria-label="Message customer" placeholder="Type your message..." disabled style="flex:1; border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-family:inherit; font-size:14px; resize:none; min-height:44px; max-height:120px; line-height:1.4; background:var(--bg); color:var(--text-main);"></textarea>
                <button id="admin-chat-send" type="button" aria-label="Send message" disabled style="width:44px; height:44px; border-radius:50%; background:#be185d; color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;"><i data-lucide="send" style="width:18px; margin-left:-2px;"></i></button>
              </div>
            </div>
          </div>
        </div>

    </div>
  </main>
  </div><!-- end .shell-body -->
</div><!-- end .app -->

<style>
.chat-sidebar { border-right: 1px solid var(--border); background: var(--surface); }

.chat-contact-item { padding: 18px 24px; display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--border); cursor: pointer; transition: background-color 0.16s ease-out; }
.chat-contact-item:hover { background: var(--bg); }
.chat-contact-item.active { background: var(--bg); border-left: 4px solid #be185d; padding-left: 20px; }
.chat-avatar { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; flex-shrink:0; }
.chat-contact-info { flex: 1; overflow: hidden; }
.chat-contact-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.chat-contact-name { font-weight: 700; font-size: 15px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.chat-contact-time { font-size: 11px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.chat-contact-bottom { display: flex; justify-content: space-between; align-items: center; }
.chat-contact-preview { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-badge { background: #be185d; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 12px; }

/* Message Bubbles */
.chat-msg-row { display: flex; gap: 12px; max-width: 85%; margin-bottom: 8px; }
.chat-msg-row.sent { flex-direction: row-reverse; align-self: flex-end; }
.chat-msg-row.received { align-self: flex-start; }
.chat-bubble { padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.5; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.chat-msg-row.sent .chat-bubble { background: #be185d; color: #fff; border-bottom-right-radius: 4px; }
.chat-msg-row.received .chat-bubble { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-msg-time { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chat-msg-row.sent .chat-msg-time { text-align: right; }

#chat-input-container { background: var(--surface) !important; }
#admin-chat-input { background: var(--bg); border: 1px solid var(--border) !important; color: var(--text-main); transition: border-color 0.16s ease-out; }
#admin-chat-input:focus { border-color: #f472b6 !important; }
#admin-chat-send { background: #be185d !important; transition: background-color 0.16s ease-out, transform 0.08s ease-out; }
#admin-chat-send:hover:not(:disabled) { background: #9d174d !important; }
#admin-chat-send:active:not(:disabled) { transform: scale(0.96); }
</style>

<script src="js/admin-ui.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-chat.js?v=20261012_2"></script>
<script>
lucide.createIcons();
// Overriding some display logic to match our new layout
const observer = new MutationObserver(() => {
    const empty = document.getElementById('admin-chat-empty');
    if(empty && empty.style.display === 'none') {
        document.getElementById('chat-header-container').style.display = 'flex';
        document.getElementById('admin-chat-messages').style.display = 'flex';
        document.getElementById('chat-input-container').style.display = 'block';
    }
});
observer.observe(document.getElementById('admin-chat-empty'), { attributes: true, attributeFilter: ['style'] });
</script>
</body>
</html>
