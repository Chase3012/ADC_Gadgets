<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="ADC Gadgets Admin Dashboard — Analytics and Sales overview.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── Dashboard-specific overrides ── */
    .dash-tabs { display: flex; gap: 4px; background:var(--border); border-radius: 10px; padding: 4px; margin-bottom: 28px; width: fit-content; }
    .dash-tab { padding: 8px 22px; font-size: 13px; font-weight: 600; border-radius: 7px; border: none; cursor: pointer; background: transparent; color: var(--text-muted); transition: all .2s; }
    .dash-tab.active { background:var(--surface); color: var(--text-main); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .kpi-card { background:var(--surface); border-radius: 14px; padding: 22px 20px; border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 14px 14px 0 0; }
    .kpi-card.pink::before  { background: #ec4899; }
    .kpi-card.blue::before  { background: #3b82f6; }
    .kpi-card.green::before { background: #22c55e; }
    .kpi-card.orange::before{ background: #f59e0b; }
    .kpi-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 10px; }
    .kpi-val   { font-size: 30px; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em; line-height: 1; }
    .kpi-sub   { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .kpi-icon  { position: absolute; right: 18px; top: 18px; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .kpi-icon.pink   { background: #fce7f3; color: #ec4899; }
    .kpi-icon.blue   { background: #dbeafe; color: #3b82f6; }
    .kpi-icon.green  { background: #dcfce7; color: #22c55e; }
    .kpi-icon.orange { background: #fef3c7; color: #f59e0b; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .grid-2-3 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }

    .panel-card { background:var(--surface); border-radius: 14px; border: 1px solid #e2e8f0; padding: 24px; }
    .panel-card h3 { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
    .panel-card .card-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
    .panel-card .divider { height: 1px; background:var(--border); margin: 16px 0; }

    /* Loan rows */
    .loan-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom:1px solid var(--border); }
    .loan-row:last-child { border-bottom: none; padding-bottom: 0; }
    .loan-avatar { width: 38px; height: 38px; border-radius: 10px; background:var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; font-weight: 700; color: var(--pink); }
    .loan-name  { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .loan-device{ font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .loan-amount{ margin-left: auto; text-align: right; }
    .loan-amount .amount { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .loan-amount .status-pill { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 3px; }
    .status-pill.active    { background: #dcfce7; color: #16a34a; }
    .status-pill.completed { background: #dbeafe; color: #1d4ed8; }
    .status-pill.overdue   { background: #fee2e2; color: #dc2626; }

    /* Progress bar */
    .prog-row { margin-bottom: 14px; }
    .prog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--text-main); }
    .prog-bar { height: 8px; background:var(--border); border-radius: 4px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 4px; }
    .prog-sub  { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Mini stat */
    .mini-stat { display: flex; align-items: center; gap: 12px; padding: 14px; background:var(--surface); border-radius: 10px; margin-bottom: 10px; }
    .mini-stat:last-child { margin-bottom: 0; }
    .mini-stat-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .mini-stat-label { font-size: 12px; color: var(--text-muted); }
    .mini-stat-val   { font-size: 15px; font-weight: 700; color: var(--text-main); }

    /* Empty / loading */
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; height: 20px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>

        <div style="width:36px; height:36px; background:#0F172A; color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">AD</div>
      </div>

    <div class="content">

      <div id="panel-inventory" class="dash-panel">
        <div class="card">

<script>
lucide.createIcons();

// ── Auth Check ──
const admin = JSON.parse(localStorage.getItem('admin_user') || 'null');
if (!admin) { window.location.href = 'login.html'; }
else {
  const n = admin.full_name || admin.name || admin.email?.split('@')[0] || 'Admin';
  document.getElementById('sidebar-admin-name').textContent = n;
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('admin_user');
  window.location.href = 'login.html';
});

// ── Tab Switching ──
const tabs = ['analytics','sales'];
function switchTab(tab) {
  tabs.forEach(t => {
    document.getElementById('panel-' + t).style.display = t === tab ? '' : 'none';
    document.getElementById('btn-tab-' + t).classList.toggle('active', t === tab);
    const sl = document.getElementById('tab-link-' + t);
    if (sl) sl.classList.toggle('active', t === tab);
  });
  document.getElementById('page-title').textContent = tab === 'analytics' ? 'Analytics' : 'Sales';
  loadStats();
}

document.querySelectorAll('.dash-tab').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
document.querySelectorAll('[data-tab]').forEach(el => {
  if (el.classList.contains('nav-sub-item')) {
    el.addEventListener('click', e => { e.preventDefault(); switchTab(el.dataset.tab); });
  }
});

// ── Format helpers ──
function peso(n) {
  if (n >= 1_000_000) return '₱' + (n/1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return '₱' + (n/1_000).toFixed(1) + 'k';
  return '₱' + n.toLocaleString('en-PH', {minimumFractionDigits:0});
}
function pesoFull(n) { return '₱' + parseFloat(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function initials(name) {
  if (!name) return '?';
  return name.trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

// ── Load Stats ──
async function loadStats() {
  try {
    const res = await fetch('/dashboard/stats');
    if (!res.ok) throw new Error('Failed');
    const d = await res.json();

    // Analytics KPIs
    document.getElementById('kpi-srp').textContent     = peso(d.totalSrp);
    document.getElementById('kpi-balance').textContent  = peso(d.totalRemainingBalance);
    document.getElementById('kpi-users').textContent    = d.totalUsers;
    document.getElementById('kpi-monthly').textContent  = peso(d.monthlyCollections);

    document.getElementById('stat-active').textContent    = d.activeLoans + ' loans';
    document.getElementById('stat-completed').textContent = d.completedLoans + ' loans';

    const totalLoans = d.activeLoans + d.completedLoans;
    const rate = totalLoans > 0 ? Math.round((d.completedLoans / totalLoans) * 100) : 0;
    document.getElementById('stat-rate').textContent = rate + '%';

    const collected = d.totalSrp - d.totalRemainingBalance;
    const progPct   = d.totalSrp > 0 ? Math.round((collected / d.totalSrp) * 100) : 0;
    document.getElementById('prog-label').textContent = progPct + '%';
    document.getElementById('prog-fill').style.width  = progPct + '%';
    document.getElementById('prog-sub').textContent   = pesoFull(collected) + ' collected of ' + pesoFull(d.totalSrp);

    // Recent Loans
    const list = document.getElementById('recent-loans-list');
    if (!d.recentLoans || d.recentLoans.length === 0) {
      list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px 0;">No loan records found.</p>';
    } else {
      list.innerHTML = d.recentLoans.map(l => {
        // Better name fallback — never show "Unknown"
        const name = l.full_name 
          ? l.full_name 
          : l.email 
            ? l.email.split('@')[0] 
            : 'User #' + l.user_id.substring(0, 6);
        const status = l.status || 'active';
        return `<div class="loan-row">
          <div class="loan-avatar">${initials(name)}</div>
          <div>
            <div class="loan-name">${name}</div>
            <div class="loan-device">${l.device_name}${l.device_color ? ` - ${l.device_color}` : ''}</div>
          </div>
          <div class="loan-amount">
            <div class="amount">${pesoFull(l.remaining_balance)}</div>
            <span class="status-pill ${status}">${status.charAt(0).toUpperCase()+status.slice(1)}</span>
          </div>
        </div>`;
      }).join('');
    }

    // Sales KPIs — use actual payments collected, not just SRP
    const totalUnits = d.totalLoans || (d.activeLoans + d.completedLoans);
    document.getElementById('sales-kpi-srp').textContent     = peso(d.totalPaymentsCollected || 0);
    document.getElementById('sales-kpi-units').textContent   = totalUnits;
    document.getElementById('sales-kpi-avg').textContent     = totalUnits > 0 ? peso(d.totalSrp / totalUnits) : '₱0';
    document.getElementById('sales-kpi-monthly').textContent = peso(d.monthlyCollections);

    // Sales Table (Transactions History)
    const tbody = document.getElementById('sales-table-body');
    if (!d.recentPayments || d.recentPayments.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="padding:40px;text-align:center;color:var(--text-muted);">No transactions found.</td></tr>';
    } else {
      tbody.innerHTML = d.recentPayments.map(p => {
        const name   = p.full_name 
          ? p.full_name 
          : p.email 
            ? p.email.split('@')[0] 
            : 'User #' + (p.user_id ? p.user_id.substring(0, 6) : '????');
        const email  = p.email || '';
        const dateStr = new Date(p.payment_date).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        
        const methodStr = p.payment_method ? `<div style="font-size:11px;color:var(--text-muted);font-weight:500;">via ${p.payment_method}</div>` : '';
        return `<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:14px 8px;font-size:12px;color:var(--text-muted);">${dateStr}</td>
          <td style="padding:14px 8px;font-weight:600;">${name}<div style="font-size:11px;color:var(--text-muted);font-weight:400;">${email}</div></td>
          <td style="padding:14px 8px;font-size:13px;">${p.device_name || 'N/A'}${p.device_color ? ` - ${p.device_color}` : ''}</td>
          <td style="padding:14px 8px;text-align:right;color:var(--pink);font-weight:700;">${pesoFull(p.amount_paid)}${methodStr}</td>
          <td style="padding:14px 8px;text-align:center;"><span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#dcfce7;color:#16a34a;">Paid</span></td>
        </tr>`;
      }).join('');
    }

  } catch (err) {
    console.error('Dashboard load error:', err);
    document.getElementById('kpi-srp').textContent = 'Error';
  }
}

loadStats();
// Auto-refresh every 30 seconds so data stays live
setInterval(loadStats, 30000);
</script>
<script src="js/admin-ui.js"></script>

    <!-- INVENTORY MODAL -->

          <div>

            <div id="inv-img-dropzone" style="border:2px dashed var(--border); border-radius:10px; padding:20px 12px; text-align:center; cursor:pointer; background:var(--surface); transition:all .2s; position:relative;">

              </div>
              <img id="inv-img-preview" src="" alt="preview" style="display:none;max-height:100px;max-width:100%;object-fit:contain;border-radius:8px;">
              <input type="file" id="inv-img-file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;">

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
              <div>
                <label style="font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; margin-bottom:4px; display:block;">SRP (₱)</label>
                <input type="number" id="inv-srp" class="form-input" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface);" required>

              <div>

                <input type="number" id="inv-stock" class="form-input" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface);" required>
              </div>
          </div>
          
          <div>
            <label style="font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; margin-bottom:4px; display:block;">AppleDB ID (Internal)</label>
            <input type="text" id="inv-appledb" class="form-input" placeholder="e.g. iPhone17,3" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface);">

            <label style="font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; margin-bottom:4px; display:block;">Status</label>
            <select id="inv-status" class="form-input" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface);">
